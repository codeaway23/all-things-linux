# Alacritty dropped YAML support in 0.13 and removed the migration path in 0.14,
# so this file replaces the old alacritty.yml. Config lives at
# ~/.config/alacritty/alacritty.toml.

[env]
WINIT_X11_SCALE_FACTOR = "1"

[general]
live_config_reload = true

[window]
dynamic_title = true

[window.padding]
x = 10
y = 10

[scrolling]
history = 100000
multiplier = 3

[font]
size = 14

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

[font.bold]
family = "FiraCode Nerd Font"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font"
style = "Italic"

[colors]
draw_bold_text_with_bright_colors = true

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[cursor]
style = { shape = "Underline" }
